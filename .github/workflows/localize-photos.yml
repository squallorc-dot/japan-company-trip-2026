name: Localize travel photos
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/localize-photos.yml
      - scripts/localize_photos.py
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: travel-photo-localization
  cancel-in-progress: false
jobs:
  localize-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install photo tools
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Download & verify original photographs
        run: python scripts/localize_photos.py
      - name: Check complete photo collection and app code
        run: |
          test "$(find assets/photos -type f -name '*.webp' | wc -l)" -eq 6
          node --check app.js
          node --check media.js
          node scripts/validate-data.mjs
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for path in Path('assets/photos').glob('*.webp'):
              with Image.open(path) as im:
                  im.verify()
              print('Verified',path)
          PY
      - name: Commit localized photos to the independent project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/photos media.js sw.js data.js version.json
          git commit -m 'Keep six licensed travel photographs locally for fast and offline viewing'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4