name: Travel website responsive visual smoke test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Generate attributed photos and PWA icon
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/build-photos.py
          python scripts/build-icons.py
      - name: Run desktop, mobile, day and plan checks
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/japan-trip-visual-server.log 2>&1 &
          sleep 2
          node scripts/visual-smoke.mjs
      - name: Upload visual audit and screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-trip-responsive-screenshots
          path: artifacts/
          retention-days: 10
