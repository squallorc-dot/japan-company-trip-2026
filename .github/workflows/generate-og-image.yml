name: Generate social preview image
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build-social-image.py
permissions:
  contents: write
jobs:
  make-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build JPEG social preview
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/build-social-image.py
      - name: Commit social preview into this repository
        run: |
          git add assets/og-cover.jpg
          if git diff --cached --quiet; then
            echo "No OG image changes"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Add locally hosted Japan trip social preview image"
            git push origin HEAD:main
          fi
